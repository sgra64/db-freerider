services:
  mysql-demo-db:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysql-demo-image:latest
    container_name: mysql-demo-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: demo_DB
    ports:
      - "3306:3306"
