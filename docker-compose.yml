    # MYSQL_NATIVE_PASSWORD: on
    # MYSQL_ALLOW_EMPTY_PASSWORD: yes
    # MYSQL_ROOT_PASSWORD:
    # MYSQL_DATABASE: "FREERIDER_DB"
    # MYSQL_USER: "freerider"
    # MYSQL_PASSWORD: "free.ride"
